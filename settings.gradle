pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		mavenLocal()
		maven {
			url 'https://jitpack.io'
		}
	}
}

include ':app'

// Para desarrollo local (sin JitPack):
// 1. Copiar la carpeta zatsu-parsers a la raíz del proyecto
// 2. Descomentar la siguiente línea:
// include ':zatsu-parsers'

rootProject.name = "Zatsu"
